[project]
name = "locrag"
version = "0.1.0"
description = "LocRAG: semantic search (RAG) fallback for translation-memory lookups when fuzzy matching fails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=2.54.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sacrebleu>=2.6.0",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
local = ["sentence-transformers>=6.3.0", "torch>=2.15.0"]

[dependency-groups]
dev = ["pytest>=9.2.0"]

# CPU-only PyTorch wheels (local embedding models run on CPU)
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
