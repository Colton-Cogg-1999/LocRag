name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - name: Rebuild evidence without models or keys
        run: |
          uv run python -m locrag.evidence
          git diff --exit-code -- results/audit
      - name: Reproduce frontier study from recorded outputs
        run: |
          uv run python -m locrag.study.frontier summarize
          git diff --exit-code -- results/frontier/summary.json
      - name: Reproduce terminology and accuracy study from recorded reviews
        run: |
          uv run python -m locrag.study.consistency_analysis
          git diff --exit-code -- results/consistency/summary.json
      - name: Reproduce selective-router comparison
        run: |
          uv run python -m locrag.study.selective_router summarize
          git diff --exit-code -- results/selective-router/summary.json
      - name: Build static workbench
        run: |
          uv run python -m locrag.demo
          node --check demo/src/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: locrag-workbench
          path: demo/dist
